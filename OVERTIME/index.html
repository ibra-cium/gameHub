<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>OVERTIME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #050605;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Device rotation overlay for mobile portrait view */
#rotate-device-overlay {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background: radial-gradient(circle at center, rgba(15, 22, 15, 0.98) 0%, rgba(5, 6, 5, 0.99) 100%);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	z-index: 999999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	color: #ffffff;
}

@media screen and (orientation: portrait) and (max-width: 1024px) {
	#rotate-device-overlay {
		display: flex;
	}
}

.rotate-device-content {
	display: flex;
	flex-direction: column;
	align-items: center;
	max-width: 320px;
	padding: 32px 24px;
	border-radius: 20px;
	background: rgba(255, 255, 255, 0.04);
	border: 1px solid rgba(255, 255, 255, 0.1);
	box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(46, 204, 113, 0.15);
}

.phone-icon-wrapper {
	position: relative;
	width: 80px;
	height: 80px;
	display: flex;
	justify-content: center;
	align-items: center;
	margin-bottom: 24px;
}

.phone-icon {
	width: 42px;
	height: 64px;
	color: #2ecc71;
	animation: rotate-phone 2.4s ease-in-out infinite alternate;
	filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.5));
}

.rotate-arrow {
	position: absolute;
	top: -6px;
	right: -6px;
	width: 28px;
	height: 28px;
	color: #00e676;
	animation: spin-arrow 2.4s linear infinite;
	opacity: 0.85;
}

@keyframes rotate-phone {
	0%, 25% {
		transform: rotate(0deg);
	}
	75%, 100% {
		transform: rotate(-90deg);
	}
}

@keyframes spin-arrow {
	0% {
		transform: rotate(0deg);
	}
	100% {
		transform: rotate(-360deg);
	}
}

.rotate-title {
	font-size: 1.2rem;
	font-weight: 700;
	letter-spacing: 1.5px;
	margin: 0 0 10px 0;
	color: #ffffff;
	text-transform: uppercase;
	text-shadow: 0 0 12px rgba(46, 204, 113, 0.3);
}

.rotate-desc {
	font-size: 0.9rem;
	line-height: 1.5;
	color: #a0a0a0;
	margin: 0 0 22px 0;
}

.rotate-btn {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	background: linear-gradient(135deg, #2ecc71, #27ae60);
	color: #050605;
	border: none;
	border-radius: 12px;
	padding: 12px 20px;
	font-size: 0.92rem;
	font-weight: 700;
	cursor: pointer;
	box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
	transition: transform 0.2s ease, box-shadow 0.2s ease;
	outline: none;
	-webkit-tap-highlight-color: transparent;
}

.rotate-btn:hover, .rotate-btn:active {
	transform: scale(1.04);
	box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="rotate-device-overlay">
			<div class="rotate-device-content">
				<div class="phone-icon-wrapper">
					<svg class="phone-icon" viewBox="0 0 24 40" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect x="1.5" y="1.5" width="21" height="37" rx="3.5" stroke="currentColor" stroke-width="2"/>
						<line x1="8" y1="5" x2="16" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
						<circle cx="12" cy="33" r="1.5" fill="currentColor"/>
					</svg>
					<div class="rotate-arrow">
						<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12C4 7.58172 7.58172 4 12 4C14.6 4 16.9 5.2 18.4 7.1M18.4 7.1V3M18.4 7.1H14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</div>
				</div>
				<h2 class="rotate-title">ROTATE YOUR DEVICE</h2>
				<p class="rotate-desc">Please turn your device to landscape (horizontal) mode for the best gaming experience.</p>
				<button id="fullscreen-rotate-btn" class="rotate-btn" type="button">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
					</svg>
					Play Fullscreen & Rotate
				</button>
			</div>
		</div>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8094772,"index.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

// Mobile Landscape Orientation & Fullscreen Handler
(function() {
	function tryLockLandscape() {
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}

	function requestFullscreenAndLandscape() {
		const docEl = document.documentElement;
		const reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
		if (reqFs) {
			reqFs.call(docEl).then(() => {
				tryLockLandscape();
			}).catch(() => {
				tryLockLandscape();
			});
		} else {
			tryLockLandscape();
		}
	}

	const fsBtn = document.getElementById('fullscreen-rotate-btn');
	if (fsBtn) {
		fsBtn.addEventListener('click', requestFullscreenAndLandscape);
		fsBtn.addEventListener('touchend', function(e) {
			e.preventDefault();
			requestFullscreenAndLandscape();
		});
	}

	// Try locking orientation on first user interaction
	document.addEventListener('click', function onFirstClick() {
		tryLockLandscape();
	}, { once: true });

	document.addEventListener('touchstart', function onFirstTouch() {
		tryLockLandscape();
	}, { once: true });
})();
		</script>
	</body>
</html>
