<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Mountain Runner</title>
		<link rel="icon" type="image/png" href="runner.icon.png" />
		<link rel="apple-touch-icon" href="runner.apple-touch-icon.png"/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
		<style>
			*, *::before, *::after {
				box-sizing: border-box;
			}
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100%;
				height: 100%;
			}
			body {
				color: #fff;
				background-color: #0b0f19;
				overflow: hidden;
				touch-action: none;
				font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
			#canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			#canvas:focus {
				outline: none;
			}

			/* Modern Custom Loading Screen */
			#status {
				position: absolute;
				inset: 0;
				background: radial-gradient(circle at center, #131d2e 0%, #080c14 100%);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 9999;
				padding: 24px;
				transition: opacity 0.5s ease, visibility 0.5s ease;
			}

			.loader-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				max-width: 440px;
				width: 100%;
				background: rgba(15, 23, 42, 0.75);
				border: 1px solid rgba(16, 185, 129, 0.25);
				backdrop-filter: blur(16px);
				-webkit-backdrop-filter: blur(16px);
				border-radius: 20px;
				padding: 28px 24px;
				box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.12);
				text-align: center;
				animation: cardFadeIn 0.6s ease-out;
			}

			@keyframes cardFadeIn {
				from {
					opacity: 0;
					transform: translateY(14px) scale(0.97);
				}
				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			.cover-frame {
				width: 100%;
				height: 160px;
				border-radius: 14px;
				overflow: hidden;
				border: 1px solid rgba(255, 255, 255, 0.12);
				position: relative;
				margin-bottom: 20px;
				box-shadow: 0 8px 24px rgba(0,0,0,0.5);
			}

			.cover-img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
				transition: transform 0.4s ease;
			}

			.game-title {
				font-size: 1.5rem;
				font-weight: 900;
				letter-spacing: -0.02em;
				margin: 0 0 6px 0;
				background: linear-gradient(135deg, #ffffff 30%, #34d399 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				text-transform: uppercase;
			}

			.game-subtitle {
				font-size: 0.85rem;
				color: #94a3b8;
				margin: 0 0 20px 0;
				font-weight: 500;
			}

			/* Progress Bar Component */
			.progress-container {
				width: 100%;
				margin-bottom: 12px;
			}

			.progress-track {
				width: 100%;
				height: 10px;
				background: rgba(255, 255, 255, 0.08);
				border-radius: 9999px;
				overflow: hidden;
				border: 1px solid rgba(255, 255, 255, 0.06);
				position: relative;
			}

			.progress-fill {
				height: 100%;
				width: 0%;
				background: linear-gradient(90deg, #059669, #10b981, #06b6d4);
				border-radius: 9999px;
				transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
				box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
				position: relative;
			}

			.progress-fill::after {
				content: '';
				position: absolute;
				top: 0; left: 0; bottom: 0; right: 0;
				background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
				animation: shimmer 1.5s infinite;
			}

			@keyframes shimmer {
				0% { transform: translateX(-100%); }
				100% { transform: translateX(100%); }
			}

			.status-text-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				width: 100%;
				font-size: 0.8rem;
				font-weight: 600;
				color: #cbd5e1;
				margin-top: 8px;
			}

			.status-percent {
				color: #34d399;
				font-family: monospace;
				font-size: 0.85rem;
			}

			.controls-badge {
				margin-top: 14px;
				padding: 6px 14px;
				border-radius: 9999px;
				background: rgba(255, 255, 255, 0.05);
				border: 1px solid rgba(255, 255, 255, 0.08);
				color: #94a3b8;
				font-size: 0.75rem;
				font-weight: 500;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}

			/* Error / Notice Display */
			#status-notice {
				display: none;
				margin-top: 16px;
				background-color: rgba(239, 68, 68, 0.15);
				border-radius: 12px;
				border: 1px solid rgba(239, 68, 68, 0.4);
				color: #fca5a5;
				font-size: 0.82rem;
				line-height: 1.4;
				padding: 12px;
				text-align: center;
				max-width: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the HTML5 canvas tag.
		</canvas>

		<noscript>
			<div style="color:white; text-align:center; padding: 40px;">Your browser does not support JavaScript.</div>
		</noscript>

		<!-- Custom Branded Loading Screen -->
		<div id="status">
			<div class="loader-card">
				<div class="cover-frame">
					<img class="cover-img" src="mountain_runner_cover.png" alt="Mountain Runner Cover" onerror="this.src='runner.icon.png'">
				</div>
				<h1 class="game-title">Mountain Runner</h1>
				<div class="game-subtitle">Endless high-altitude sprint</div>

				<div class="progress-container">
					<div class="progress-track">
						<div id="custom-progress-bar" class="progress-fill"></div>
					</div>
					<div class="status-text-row">
						<span id="status-label">Loading game engine...</span>
						<span id="status-percent" class="status-percent">0%</span>
					</div>
				</div>

				<div class="controls-badge">
					<span>🎮</span> Controls: Arrow Keys / WASD • Space to Jump
				</div>

				<div id="status-notice"></div>
			</div>
		</div>

		<script src="runner.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"runner","experimentalVK":false,"fileSizes":{"runner.pck":37950120,"runner.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const progressBar = document.getElementById('custom-progress-bar');
	const statusLabel = document.getElementById('status-label');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.opacity = '0';
			statusOverlay.style.pointerEvents = 'none';
			setTimeout(() => {
				statusOverlay.remove();
			}, 500);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred while launching.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					progressBar.style.width = pct + '%';
					statusPercent.textContent = pct + '%';
					statusLabel.textContent = pct === 100 ? 'Starting game...' : 'Loading game data...';
				} else {
					progressBar.style.width = '60%';
					statusPercent.textContent = '...';
					statusLabel.textContent = 'Loading engine...';
				}
			},
		}).then(() => {
			progressBar.style.width = '100%';
			statusPercent.textContent = '100%';
			statusLabel.textContent = 'Ready!';
			setTimeout(() => {
				setStatusMode('hidden');
			}, 250);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
